name: publish

# Publishes the package with npm Trusted Publishing (OIDC): the workflow mints a
# short-lived identity token and npm exchanges it for publish rights, so no
# long-lived token is stored anywhere. npm is moving everyone this way — tokens
# that bypass 2FA stop working for direct publishing in January 2027.
#
# One-time setup, done by the maintainer on npmjs.com (the package name must
# already belong to the account):
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: dingchenhui0618-arch
#     Repository:           dsh-poker-night
#     Workflow filename:    publish.yml
#
# The project has no runtime dependencies and is built/tested with npm, so this
# workflow deliberately does not touch pnpm (the repo keeps a pnpm lockfile for
# the DSH plugin workflow, and `pnpm store path` trips over it on a bare runner).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for publish rights

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No registry-url and no NODE_AUTH_TOKEN on purpose: setup-node would
          # write `_authToken=${NODE_AUTH_TOKEN}` into .npmrc, npm would send an
          # empty bearer token, and the publish comes back as a 404 instead of
          # using the OIDC trusted-publisher identity.
      - run: npm install --no-audit --no-fund
      - run: npm test
      # Trusted publishing needs npm >= 11.5.1 (the runner's bundled npm is 10.x
      # and reports ENEEDAUTH instead of exchanging the OIDC token).
      - run: npm install -g npm@11
      - run: npm --version
      # A release can also be published from a maintainer machine (the first one
      # has to be: Trusted Publishing can only be configured once the package
      # exists). The tag push then arrives with the version already on npm, so
      # skip instead of failing the workflow on "cannot publish over".
      - name: Is this version already on npm?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-poker-night@$version" version >/dev/null 2>&1; then
            echo "dsh-poker-night@$version is already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.skip != 'true'
        run: npm publish --provenance --access public
